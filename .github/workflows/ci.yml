name: ci

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  quality:
    runs-on: ubuntu-latest

    # No database service. phpunit.xml pins DB_CONNECTION=sqlite and
    # DB_DATABASE=:memory:, which shadows whatever .env.example says, and
    # nothing else in `composer ci:check` opens a connection - so a Postgres
    # service here would sit idle. Production runs Postgres 18; the suite
    # trades that fidelity for an in-memory database it can rebuild per test,
    # which the browser suite also depends on (its server runs in the same PHP
    # process as the test). Anything that turns on Postgres-specific SQL needs
    # this decision revisited, not worked around.

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # composer test:unit runs `pest --parallel --coverage --min=96`,
          # which needs a real coverage driver. pcov over xdebug: it is
          # markedly faster and this suite only needs line coverage.
          coverage: pcov
          # PHPStan (directly, and in-process under pest --type-coverage)
          # exhausts the default 128M and crashes its parallel workers.
          ini-values: memory_limit=-1

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      # The Pest browser plugin shells out to ./node_modules/.bin/playwright and
      # needs the browser binaries on the runner. Chromium only - the suite does
      # not pin a browser, so it uses the plugin's default.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Provide the .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Builds the client bundle and the SSR bundle. Also the only thing that
      # generates the Wayfinder output under resources/js/{actions,routes},
      # which is gitignored - so this has to run before types:check.
      - name: Build
        run: npm run build:ssr

      # pint --test, phpstan, npm run check, tsc --noEmit and the Pest suite.
      - name: Check
        run: composer ci:check

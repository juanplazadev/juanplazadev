name: ci

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  quality:
    runs-on: ubuntu-latest

    # phpunit.xml sets DB_DATABASE=testing but leaves DB_CONNECTION at the
    # .env default of pgsql, so the suite needs a real Postgres to talk to.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql
          # composer test:unit runs `pest --coverage --exactly`, which needs a
          # real coverage driver. pcov over xdebug: it is markedly faster and
          # this suite only needs line coverage.
          coverage: pcov
          # PHPStan (directly, and in-process under pest --type-coverage)
          # exhausts the default 128M and crashes its parallel workers.
          ini-values: memory_limit=-1

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Provide the .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Builds the client bundle and the SSR bundle. Also the only thing that
      # generates the Wayfinder output under resources/js/{actions,routes},
      # which is gitignored - so this has to run before types:check.
      - name: Build
        run: npm run build:ssr

      # pint --test, phpstan, npm run check, tsc --noEmit and the Pest suite.
      - name: Check
        run: composer ci:check

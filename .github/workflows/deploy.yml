name: deploy-prod

# Gated on ci: a push to production runs ci.yml, and only a green run reaches
# here. workflow_dispatch stays as the manual escape hatch (redeploy the current
# production HEAD without pushing a commit).
on:
    workflow_run:
        workflows: [ci]
        branches: [production]
        types: [completed]
    workflow_dispatch:

# Deploys are not interchangeable: cancelling one mid-`up` would leave the
# stack half-recreated. Queue them instead.
concurrency:
    group: deploy-prod
    cancel-in-progress: false

permissions:
    contents: read
    packages: write

jobs:
    deploy:
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        runs-on: [self-hosted, Linux, X64]
        env:
            # workflow_run fires against the default branch, so github.sha is not
            # the commit ci actually tested. head_sha is. Everything downstream -
            # the checkout, the image tag, GIT_COMMIT - keys off this one value so
            # what ships is exactly what went green.
            IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Log in to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Self-hosted runner shared with check-in: images and build cache
            # accumulate across deploys and fill the disk. Dropping the cache
            # unconditionally would recompile the PHP extensions and re-run
            # `npm ci` twice on every deploy, so keep it by default and only fall
            # back to a full prune when the disk is actually low. Volumes are
            # left alone (the Postgres data is in one) and running containers
            # keep their images.
            - name: Reclaim Docker disk space
              run: |
                  docker system df || true
                  docker container prune -f || true
                  docker image prune -f || true
                  available=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
                  if [ "${available:-0}" -lt 25 ]; then
                    echo "Only ${available}G free - dropping the build cache to make room."
                    docker image prune -af --filter "until=24h" || true
                    docker builder prune -af || true
                  else
                    # --keep-storage was renamed --max-used-space in newer buildx;
                    # pick whichever this runner's docker actually understands.
                    if docker builder prune --help 2>&1 | grep -q -- --max-used-space; then
                      cap=--max-used-space=20GB
                    else
                      cap=--keep-storage=20GB
                    fi
                    echo "${available}G free - keeping the build cache, capped at 20G ($cap)."
                    docker builder prune -f "$cap" || true
                  fi
                  df -h / || true

            # compose.prod.yaml reads VITE_* and the DB credentials from here.
            # Vite inlines the VITE_* values, so this file's contents decide the
            # bundle - it has to be in place before the build, not before `up`.
            - name: Load prod env
              run: cp /opt/da-server/juanplazadev/.env .env

            # Tags the result as compose.prod.yaml's `image:`, i.e. :$IMAGE_TAG.
            - name: Build image
              run: docker compose -f compose.prod.yaml build

            - name: Push image
              run: |
                  docker tag ghcr.io/${{ github.repository }}:$IMAGE_TAG ghcr.io/${{ github.repository }}:latest
                  docker push ghcr.io/${{ github.repository }}:$IMAGE_TAG
                  docker push ghcr.io/${{ github.repository }}:latest

            # No `pull` first: the runner and the deploy target are the same box,
            # so the image is already local. GHCR is for history and rollback,
            # not for the deploy path.
            - name: Deploy
              run: docker compose -f compose.prod.yaml up -d --remove-orphans

            # After `up`, so the pgsql healthcheck has gated this. No seeding:
            # DatabaseSeeder creates a known-password test user, and the content
            # editor in routes/admin.php sits behind nothing but auth+verified.
            # The first admin user is created by hand, once.
            - name: Migrate
              run: docker compose -f compose.prod.yaml run --rm app php artisan migrate --force

            # The reload is not optional: `optimize` writes the config/route
            # cache after Octane's workers have already booted, so without it
            # they keep serving with the uncached config they started on.
            - name: Optimize
              run: |
                  docker compose -f compose.prod.yaml exec -T app php artisan optimize
                  docker compose -f compose.prod.yaml exec -T app php artisan octane:reload

            # `up -d` returns as soon as the container is created, which would
            # make a container that crashes on boot look like a green deploy.
            # Lean on the healthcheck the Dockerfile defines - it covers both
            # Octane and the SSR process.
            - name: Wait for healthy
              run: |
                  for _ in $(seq 1 30); do
                    status=$(docker inspect -f '{{.State.Health.Status}}' juanplaza 2>/dev/null || echo missing)
                    if [ "$status" = healthy ]; then
                      echo "juanplaza is healthy"
                      exit 0
                    fi
                    echo "status=$status, waiting..."
                    sleep 5
                  done
                  echo "juanplaza never became healthy"
                  docker logs --tail 50 juanplaza || true
                  exit 1

            # Last, so a release only exists for a deploy that actually served
            # traffic - a build that never went healthy is already a red run
            # here and does not need a row on the errors dashboard.
            #
            # The posted `version` MUST equal the SENTRY_RELEASE baked into
            # the image by compose.prod.yaml; both are IMAGE_TAG, which is why
            # that value is the workflow's single source of provenance. If they
            # drift, Sentry shows a release with no events against it.
            #
            # continue-on-error because this is bookkeeping, not the deploy: the
            # app is already healthy by this point, and a Sentry outage must not
            # turn a good release red. Same split the read side uses, where
            # ErrorInsights lets an optional half fail without taking the page.
            #
            # The token is the ORGANIZATION auth token (org:ci), not the user
            # token in .env - see .ai/rules/sentry.md. They are opposites: the
            # org one creates releases and cannot read issues, the user one
            # reads issues and cannot create releases.
            #
            # Two curl calls rather than getsentry/action-release, which is a
            # Docker action: `Log in to GHCR` above leaves the repo-scoped
            # GITHUB_TOKEN in the runner's credential store, docker then sends
            # it for every ghcr.io pull, and GHCR answers `denied` for another
            # org's package instead of falling back to an anonymous one. The
            # action's image is public - the login is what breaks it. Any
            # third-party Docker action placed after the push step fails the
            # same way.
            #
            # The deploys call is not optional: /releases/ alone leaves
            # lastDeploy null, and ErrorInsights::environment() reads exactly
            # that to decide whether a release carries the production badge.
            - name: Tag the Sentry release
              continue-on-error: true
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_RELEASE_TOKEN }}
                  SENTRY_API_URL: ${{ vars.SENTRY_API_URL || 'https://us.sentry.io/api/0' }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORGANIZATION }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
              run: |
                  body="$RUNNER_TEMP/sentry-response.json"

                  # Status check rather than `curl -f`: re-tagging an existing
                  # release answers 208, which is a success here, and a real
                  # failure should print Sentry's reason rather than an exit
                  # code. The token only ever travels in a header.
                  post() {
                    code=$(curl -sS -o "$body" -w '%{http_code}' -X POST "$SENTRY_API_URL$1" \
                      -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
                      -H 'Content-Type: application/json' \
                      -d "$2")
                    echo "POST $1 -> $code"
                    if [ "$code" -ge 400 ]; then cat "$body"; echo; return 1; fi
                  }

                  post "/organizations/$SENTRY_ORG/releases/" \
                    "{\"version\":\"$IMAGE_TAG\",\"projects\":[\"$SENTRY_PROJECT\"],\"dateReleased\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

                  post "/organizations/$SENTRY_ORG/releases/$IMAGE_TAG/deploys/" \
                    '{"environment":"production"}'

name: profile

# Refreshes the GitHub profile README (this repo's README.md + profile/) once a day.
#
# Runs on the VPS's self-hosted runner: checks out this repo and the generator
# (juanplazadev/profile-readme), builds the generator image, lets it fetch fresh GitHub
# stats and redraw the SVGs straight into the checkout, then commits whatever changed.
#
# The commit is pushed with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN never trigger
# other workflows, so ci and deploy-prod stay quiet. "[skip ci]" is a second guard.

on:
  schedule:
    - cron: "17 12 * * *"            # daily at 12:17 …
      timezone: "America/New_York"    # … New York time
  workflow_dispatch:                  # "Run workflow" button / gh workflow run profile.yml

permissions:
  contents: write                     # push the refreshed README

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out profile repo
        uses: actions/checkout@v6
        with:
          ref: main
          path: site

      - name: Check out generator
        uses: actions/checkout@v6
        with:
          repository: juanplazadev/profile-readme
          path: generator

      # The build cache lives on the VPS, so after the first run this takes seconds.
      - name: Build generator image
        run: docker build --target prod -t profile-readme:latest generator

      - name: Fetch stats, render SVGs, write README
        env:
          GITHUB_TOKEN: ${{ github.token }}             # public stats
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}   # optional: adds private contributions
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}       # optional: only used once devUser is set
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/site:/target" \
            -e GITHUB_TOKEN -e PROFILE_TOKEN -e DEV_API_KEY -e GITHUB_ACTIONS \
            profile-readme:latest all

      - name: Commit and push
        working-directory: site
        run: |
          git add README.md profile
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile [skip ci]"
          git pull --rebase origin main     # in case main moved while this ran
          git push origin HEAD:main

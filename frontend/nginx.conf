server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite content-hashes everything under /assets, so these are safe to pin.
    # No `expires` directive here — it emits its own Cache-Control and the
    # response would carry two conflicting ones.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must never be cached, or a deploy ships new hashed assets
    # that no browser is told to ask for.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # BrowserRouter owns the URL space: hand any unmatched path to the SPA
    # instead of 404ing, so deep links and refreshes resolve. Spring Boot will
    # need the equivalent (a WebMvcConfigurer forwarding non-/api misses to
    # /index.html) once it takes over this container.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

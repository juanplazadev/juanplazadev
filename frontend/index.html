<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Juan Plaza — Software Engineer</title>
    <meta
      name="description"
      content="Juan Plaza is a software engineer building web applications with Laravel, Spring Boot, React and TypeScript."
    />

    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:ital,wght@0,600;0,700;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Set the theme class and palette attribute before first paint. Without
      // this the page renders light/ember for a frame and then snaps. Kept
      // inline and dependency-free so it runs ahead of the module bundle.
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) root.classList.add("dark");
        } catch (e) {
          // Private mode or blocked storage: fall through to the light default.
        }
        try {
          // Whitelisted, not applied verbatim: the value comes from storage, and
          // an unrecognised one would leave the page with no palette bound at
          // all. Keep in sync with PALETTES in src/palette-context.ts.
          var palettes = ["ember", "moss", "lagoon", "cobalt", "orchid", "crimson"];
          var palette = localStorage.getItem("palette");
          root.dataset.palette = palettes.indexOf(palette) === -1 ? "ember" : palette;
        } catch (e) {
          root.dataset.palette = "ember";
        }
      })();
    </script>
  </head>
  <body class="font-inter bg-background text-foreground tracking-tight antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

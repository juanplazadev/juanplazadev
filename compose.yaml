name: juanplaza

# Development. Two services once the backend exists, because HMR needs a live
# Vite dev server that cannot be the same process as the API - which is the
# whole reason /api is proxied. Production collapses to one container; see
# compose.prod.yaml.
#
# Ports come from .env (cp .env.example .env) so this file and
# frontend/vite.config.ts never disagree about them.

services:
  web:
    container_name: juanplaza
    build:
      context: ./frontend
      target: dev
    # 1:1 mapping so Vite's HMR websocket needs no hmr.clientPort override.
    ports:
      - "${VITE_PORT:-5180}:${VITE_PORT:-5180}"
    environment:
      VITE_PORT: "${VITE_PORT:-5180}"
      APP_PORT: "${APP_PORT:-8080}"
      # Overrides the .env value: from inside the container, the backend on the
      # host is host.docker.internal, not localhost. Switch to http://api:8080
      # when the api service below is uncommented.
      VITE_API_PROXY_TARGET: "http://host.docker.internal:${APP_PORT:-8080}"
      # The bind mount is ./frontend:/app, so vite.config.ts's envDir ("..")
      # lands on / inside the container, where there is no .env. Anything the
      # client code reads through import.meta.env has to be handed over as a
      # real environment variable instead - Vite picks up VITE_-prefixed ones
      # from process.env the same way it picks them up from a file.
      VITE_WEATHER_LATITUDE: "${VITE_WEATHER_LATITUDE:-}"
      VITE_WEATHER_LONGITUDE: "${VITE_WEATHER_LONGITUDE:-}"
      VITE_WEATHER_TIMEZONE: "${VITE_WEATHER_TIMEZONE:-}"
      VITE_WEATHER_API_URL: "${VITE_WEATHER_API_URL:-}"
    volumes:
      # Bind-mount the source for hot reload, but shadow node_modules with an
      # anonymous volume so the image's linux binaries (esbuild, rollup) are not
      # masked by the host's darwin-arm64 ones.
      - ./frontend:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Spring Boot, not yet created. Uncommenting this means also setting
  # VITE_API_PROXY_TARGET above to http://api:8080 so the proxy resolves the
  # service by name rather than reaching back out to the host.
  #
  # api:
  #   container_name: juanplaza-api
  #   build:
  #     context: ./backend
  #   ports:
  #     - "${APP_PORT:-8080}:8080"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: dev
  #   restart: unless-stopped
